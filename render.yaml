services:
  - type: web
    name: minervini-os-dashboard
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: bash start_render.sh
    disk:
      name: data-disk
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 10000
